name: Helicar UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Helicar UI Tests
        run: python Test_Helicar_Booking.py

      # ✅ THIS PART SAVES YOUR EXCEL AFTER TESTS RUN
      - name: Upload Test Results Excel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results-Excel
          path: Test_Cases_Helicar.xlsx
